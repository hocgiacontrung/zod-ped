# ============================================================
# ZOD Pedestrian Intent & Trajectory Dataset — Schema v0.2
# Last updated: 2026-06-30
#
# SUPERSEDES v0.1 (configs/dataset_schema_v0.1.yaml), which is kept frozen as the
# supervisor-approved Week-1 snapshot. This file is the LIVE source of truth; it reconciles
# the schema with the post-pivot pipeline reality. Changes vs v0.1:
#   - filtering: split into Step-1 pedestrian selection vs Step-2 per-window assembly;
#     require_lidar_detection is no longer a hard filter (GOLD seeds geometrically).
#   - trajectory.frames: added num_lidar_points; in_observation re-defined to mean "detector
#     observed this scan" (false while coasting), matching the tracker output.
#   - 2026-06-24: removed trajectory.frames.tracking_lost — it was byte-identical to
#     `not in_observation` (a coast IS the lost state in this single-pass design); per-doc
#     trajectory schema bumped v0.1 -> v0.2 and existing outputs migrated.
#   - trajectory generation notes: 2D detector → frustum lift + KF/RTS linker (was LiDAR IoU / nearest-neighbor).
#   - intent: added soft_label.
#   - 2026-06-30: split ACTION (track-level, Step 2) from INTENT (forward-looking per-window, Step 3)
#     so the two are never conflated. Added an `action` block (crosses_ego_corridor [primary] +
#     crossing_frame_timestamp/t_c + ego_distance_at_crossing_m + crosses_ego_road [complement] +
#     undetermined status for EMPTY tracks). Redefined intent.label as the forward-looking
#     prediction (t_c within the horizon after window_end), resolving the v0.1 crossing_definition
#     TBD. Windowing is now TTE-anchored (was a 0.25s dense stride grid). Step renumber: action =
#     Step 2, sample assembly + intent = Step 3 (filters moved to Step 3). See docs/PIPELINE.md.
#   - dataset_stats: basis is the 358-sequence working set; totals PENDING recomputation.
#   - 2026-07-15: reconciled intent + windowing with the 2026-07-08 corridor bench. ACTION label source CONFIRMED as model consensus: 3
#     local JAAD/PIE-trained models (LSTM-LSTM baseline, LSTM-diffusion, transformer-diffusion) vote on the TRACK-LEVEL verdict (crossed / not, and
#     when); the geometric feet-on-road test is the validation ANCHOR, not final label. INTENT
#     is per-window and a SEPARATE later step.
#     Replaced the stale v0.1-era rule/pose/VLM method mix. Action ≠ intent — never conflate.
#   - 2026-07-16: consensus-committee membership revised (pretrained weights required): PV-LSTM
#     first + PedGraph+/TAMformer candidates; pip-thesis + PCPA out for now. Still in discussion.
#   - 2026-07-15 (b): Step 3 IMPLEMENTED (scripts/03_assemble_samples.py, zodped.labeling.samples).
#     Additions the implementation materialises: sample.anchor_tte_s + sample.window_kind (window
#     provenance), intent.labels_by_horizon (label per horizon; scalar `label` reads at the
#     window's own anchor TTE), multimodal.camera_frames[].bbox_xyxy (+ bbox_source,
#     n_box_corners_visible — the tracked 3D box projected per camera frame: the observation
#     input of the JAAD/PIE model family, defined on coasted frames too), and
#     context.observed_fraction_window. distance_to_road_m is measured against the road SURFACE
#     in 3D (keyframe-scan LiDAR points inside ego_road, lifted to world) — same point-in-polygon
#     test as Step 2, no fisheye unprojection.
#
# STATUS LEGEND:
#   [CONFIRMED]  — decided, ready to implement
#   [PENDING]    — needs explicit supervisor decision
# ============================================================

# ─────────────────────────────────────────
# WINDOWING STRATEGY
# ─────────────────────────────────────────

windowing:
  # [CONFIRMED] Unit of data = one observation window
  # One sequence → multiple pedestrians → multiple windows → multiple samples.
  # Windows are materialised in Step 3 (sample assembly), TTE-anchored on the Step-2 crossing
  # onset (t_c) — NOT a dense pre-enumerated stride grid (which re-introduces trivial windows
  # during/after the crossing and breaks JAAD/PIE crossing-prediction comparability).
  unit: observation_window

  # [CONFIRMED] Duration of observation window
  observation_window_s: 0.5        # ~5 camera frames, ~4 LiDAR scans at ZOD rates (≈PIE's 15–16 frames)

  # [CONFIRMED] Prediction horizons — evaluate at all three (following PIE's TTE setup).
  # A window is sampled ENDING at t_c − TTE; the label is the FUTURE event at that lead time.
  prediction_horizons_s: [1.0, 1.5, 2.0]

  # [CONFIRMED] For NON-crossers (no t_c), sample a comparison window at the closest OBSERVED
  # approach to the ego ROAD (min distance_to_road_m over frames with a real detection), gated on
  # min_observed_fraction_comparison=0.7 real detections in the window. Anchoring on the raw
  # closest approach let the negative class fill with coasted (Kalman-extrapolated) segments —
  # a label-correlated smoothness artifact models would shortcut on (v1: negatives 0.42
  # observed_frac vs positives 0.92; fixed 2026-07-15: 0.93 vs 0.92).
  # Optional denser sampling is allowed for trajectory-prediction experiments, but the
  # crossing-prediction benchmark split uses the TTE-anchored samples only.
  sampling: tte_anchored


# ─────────────────────────────────────────
# FILTERING / INCLUSION CRITERIA
# ─────────────────────────────────────────
# Split by pipeline stage: all position/availability filters are
# deferred to Step 3 (sample assembly), where per-frame TRACKED positions exist

filtering:

  # --- Step 1: pedestrian selection (trajectory generation) ---
  # [CONFIRMED] Skip 2D-only pedestrians (no location_3d).
  require_3d_annotation: true

  # [CONFIRMED] A keyframe LiDAR-in-box check is NOT a hard filter. GOLD tracks seed
  # geometrically from the box centre and recover depth from later-frame detections, so a
  # sparse keyframe return does not disqualify a pedestrian. (Was require_lidar_detection in v0.1.)
  require_lidar_detection: false

  # --- Step 3: per-window assembly (requires tracked trajectory) ---
  # [CONFIRMED] Minimum valid LiDAR frames per window; skip windows with missing scans.
  min_lidar_frames_in_window: 3    # out of ~4 expected

  # [CONFIRMED] Max distance from pedestrian to ego vehicle, at the window midpoint.
  # Pedestrians >50m are too small in camera frame and have sparse LiDAR points.
  max_distance_to_ego_m: 50.0

  # [CONFIRMED] Max distance from pedestrian to ego road boundary, at the window midpoint.
  # Pedestrians far from the road are not crossing candidates.
  max_distance_to_road_m: 15.0

  # [CONFIRMED] No occlusion-based filtering; all windows included, flagged in metadata.
  max_occlusion: Heavy


# ─────────────────────────────────────────
# SAMPLE STRUCTURE
# ─────────────────────────────────────────

sample:

  # --- Identity ---
  sequence_id: str               # e.g. "000007"
  pedestrian_id: str             # annotation_uuid from object_detection.json
  sample_id: str                 # "{sequence_id}_{pedestrian_id}_{window_start_ms}"

  # --- Temporal ---
  # [CONFIRMED] Time-based definition (not frame-count-based)
  # Allows fair cross-dataset comparison despite different sensor fps
  window_start_timestamp: str    # UTC, ISO format
  window_end_timestamp: str      # UTC (= window_start + 0.5s)
  keyframe_timestamp: str        # UTC timestamp of ZOD annotation frame
                                 # Note: keyframe is the central frame of the full
                                 # 20s sequence, not necessarily inside this window
  # [CONFIRMED] Window provenance (Step 3): how this window was sampled.
  window_kind: tte_anchored | closest_approach   # crosser TTE window vs non-crosser comparison
  anchor_tte_s: float            # the TTE this window was anchored at; null for comparison windows


  # ─────────────────────────────────────────
  # ACTION LABEL (track-level — Step 2; denormalised into each of the pedestrian's samples)
  # ─────────────────────────────────────────
  # The ACTION is about the WHOLE track: did this pedestrian cross, and WHEN.
  # It is computed once per track in Step 2 and copied into every
  # sample of that pedestrian. Do NOT conflate with `intent` (the forward-looking
  # per-window PREDICTION derived from this action.)
  action:
    # [CONFIRMED] CROSSING ACTION — does the track put its feet on the ego_road drivable-surface
    # polygon (project the world point through the KEYFRAME camera → point-in-polygon; FOV/range-
    # limited). This is the JAAD/PIE "crossing the roadway" notion. It is the geometric GROUND-TRUTH
    # ANCHOR for the model-consensus ACTION labeler (see `method` below) — geometry validates the
    # consensus verdict, and remains the acting label until that labeler passes its GOLD gate.
    crosses_ego_road: bool

    # [CONFIRMED] Crossing onset — timestamp of the first frame on the ego road.
    # null when crosses_ego_road = false or action = undetermined.
    crossing_frame_timestamp: str   # UTC ISO, = t_c

    # [BENCHED 2026-07-08] The ego-corridor swept-path label (crosses_ego_corridor +
    # ego_distance_at_crossing_m) was the old PRIMARY label. The crossing action is now feet-on-road
    # (the corridor requires no per-frame road). The computation is preserved in zodped.labeling.corridor, can be revived as Step-4 aux feature
    # (ego-relevance / metric range-to-crossing). Not emitted by the current pipeline.
    #   crosses_ego_corridor: bool
    #   ego_distance_at_crossing_m: float

    # [CONFIRMED] EMPTY / no-real-motion tracks (real_frac=0; "track" is Kalman coasting from a
    # single anchor) → undetermined. NEVER forced to a crossing decision; kept + flagged, excluded
    # from intent samples but retained as a verified ped instance we could not track.
    status: determined | undetermined

    # [CONFIRMED 2026-07-15] NEXT action-label source = MODEL CONSENSUS on the track-level verdict.
    # Three local JAAD/PIE-pretrained models judge the track and vote on crossed / not crossed +
    # when. Membership revised 2026-07-16 (pretrained weights required; final trio still in
    # discussion): PV-LSTM (member #1, integrating first) + candidates PedGraph+ and TAMformer;
    # pip-thesis trio + PCPA out for now — see docs/PIPELINE.md "Action label source".
    # The geometric feet-on-road test above is the validation ANCHOR,
    # and disagreement (model↔model or model↔anchor) routes the track to manual review.
    # [PENDING] adaptation design — the three are TTE-style window predictors; voting rule; how consensus and geometry combine for t_c; and the GOLD gate
    # (consensus-vs-geometry agreement) that must PASS before consensus labels at scale.
    # Current records are geometry-only (method=rule_based_geometry).
    method: rule_based_geometry | model_consensus


  # ─────────────────────────────────────────
  # INTENT LABEL (per-window PREDICTION — Step 3, derived from `action`)
  # ─────────────────────────────────────────

  intent:
    # [CONFIRMED] FORWARD-LOOKING per-window label, a SEPARATE step AFTER action labeling: given the
    # 0.5s observation window, will the pedestrian start crossing (feet on the ego ROAD, see
    # `action`) within the prediction horizon AFTER window_end. This is a PREDICTION, not a
    # description of motion inside the window (the whole point of intent
    # estimation; matches PCPA/SF-GRU on JAAD/PIE).
    label: crossing | not_crossing | uncertain

    # [CONFIRMED] v1 ROUGH intent — inferred straight from the ACTION label (resolves the v0.1
    # TBD): the track's road-crossing onset t_c (action.crossing_frame_timestamp) falls within
    # [window_end, window_end + horizon]. Evaluated per horizon in prediction_horizons_s. Inherits t_c's provenance.
    crossing_definition: t_c ∈ [window_end, window_end + horizon]   # road onset; see `action`

    # [CONFIRMED] The per-horizon evaluation above, materialised: one label per horizon. The
    # scalar `label` reads labels_by_horizon at the window's own anchor_tte_s (comparison
    # windows: not_crossing across the board). Downstream training picks its horizon here.
    labels_by_horizon:
      "1.0": crossing | not_crossing
      "1.5": crossing | not_crossing
      "2.0": crossing | not_crossing

    # [PLANNED — the step after action consensus] Behavioral intent labeling: judge the window on
    # the pedestrian's own cues — pose / body orientation, gait, attention toward the ego vehicle,
    # social context — the PIE `intention_prob` sense of intent, distinct from the future-event
    # derivation above. NOTE: ZOD's camera_front_blur anonymises faces, so facial expression / gaze
    # are unavailable.
    method: derived_from_action | behavioral | manual

    # [CONFIRMED] Confidence score from the labeling pipeline (independent of the label).
    # High: t_c far from the horizon boundary on a clean track / clearly stays away.
    # Low: t_c near the horizon boundary, heavy coasting in the window, or far-range action.
    confidence: float              # 0.0 – 1.0

    # [CONFIRMED] Soft label — class probabilities for training / calibration. v1 rough labels are
    # hard (one-hot); calibrated soft values arrive with the behavioral labeler.
    soft_label:
      p_crossing: float
      p_not_crossing: float
      p_uncertain: float


  # ─────────────────────────────────────────
  # TRAJECTORY
  # ─────────────────────────────────────────

  trajectory:
    # [CONFIRMED] Trajectory covers observation window + prediction horizon (e.g. 0.5s + 1.5s).
    # [CONFIRMED] Store both coordinate frames; use ego-relative for training.
    #   World frame: GPS-aligned, for analysis and visualization.
    #   Ego-relative: relative to ego at window_start (removes GPS drift; generalizes across
    #                 locations). Added per-window in Step 3 (sample assembly), not by Step 1.

    frames:
      - timestamp: str             # UTC timestamp of this LiDAR scan
        position_world: [x, y, z]  # meters, world/GPS-aligned frame
        position_ego_rel: [x, y, z] # meters, relative to ego at window_start
        in_observation: bool       # detector observed this scan; false while COASTING (gate empty)
        num_lidar_points: int      # points in the gate this scan (-1 = coasted, no measurement)
        kalman_confidence: float   # from innovation residual; lower = more reliable; 0.0 coasted
        tracking_method: anchor | forward | backward

        # The shipped oriented 3D box (Step 1, zodped.labeling.boxes.assemble_track_boxes):
        #   centre = tracked position; size = keyframe anchor extent (rigid per ped);
        #   yaw = heading of the smoothed velocity. Per-frame LiDAR-cluster box was rejected (docs/EXPERIMENTS_LOG.md "Boxfit cluster experiment").
        box:
          center_world: [x, y, z]  # meters; equals position_world for GOLD
          size_lwh: [l, w, h]      # meters; keyframe anchor extent (constant over the track)
          yaw_world: float         # radians, ground-plane heading
          yaw_source: velocity | static_fill | undefined
        # anchor: from ZOD keyframe annotation (highest confidence)
        # forward: propagated forward from the seed
        # backward: propagated backward from the seed

    # Trajectory generation pipeline (Step 1 — see docs/PIPELINE.md "Architecture")


  # ─────────────────────────────────────────
  # MULTIMODAL DATA (paths only, not embedded)
  # ─────────────────────────────────────────

  multimodal:

    # [CONFIRMED] Camera — ~5 frames in observation window.
    # bbox_xyxy = the tracked 3D box projected into this frame (clipped to the image): the
    # observation input of the JAAD/PIE model family, and defined on COASTED frames too. Crops are cut lazily from
    # path+bbox_xyxy by model adapters (no crop convention baked into the dataset).
    camera_frames:
      - timestamp: str
        path: str                  # relative to data/raw/sequences/XXXXXX/
        bbox_xyxy: [x1, y1, x2, y2]  # pixels; null if the box projects outside the fisheye FOV
        bbox_source: projected_3d_box
        n_box_corners_visible: int   # of 8; <8 ⇒ bbox truncated at the image border

    # [CONFIRMED] LiDAR — ~4 scans in observation window
    # Each .npy file: structured array (x, y, z, timestamp, intensity, diode_index)
    # diode_index 1–127: VLS128 main, 128–143: left VLP16, 144–159: right VLP16
    lidar_scans:
      - timestamp: str
        path: str                  # relative to data/raw/sequences/XXXXXX/

    # [CONFIRMED] Radar — path included but optional for model use (low resolution, hard to
    # isolate a single pedestrian). Provides range_rate (Doppler). Included for completeness.
    radar_path: str

    # GNSS/IMU raw data: NOT included per sample; used internally for ego-motion compensation.


  # ─────────────────────────────────────────
  # CONTEXT FEATURES
  # ─────────────────────────────────────────
  # Distilled from raw sensor data — ready to use as model input

  context:
    # [CONFIRMED] Ego vehicle state at window_start
    ego_speed_ms: float            # m/s from vehicle data
    ego_heading_deg: float         # degrees, from GNSS/IMU

    # [CONFIRMED] Turn indicator — strong context for pedestrian decision-making
    turn_indicator: none | left | right

    # [PENDING] Brake pedal — active vehicle-pedestrian negotiation (may be redundant with speed)
    brake_pedal_ratio: float       # 0.0 – 1.0

    # [CONFIRMED] Pedestrian state at window_start (from tracked trajectory)
    distance_to_ego_m: float       # meters, at the window midpoint
    distance_to_road_m: float      # meters to the nearest road-SURFACE point (keyframe-scan LiDAR
                                   # returns inside ego_road, lifted to world), at the window midpoint
    occlusion: null | Light | Heavy
    observed_fraction_window: float  # fraction of window trajectory frames with a real detection


  # ─────────────────────────────────────────
  # METADATA
  # ─────────────────────────────────────────

  metadata:
    # Geographic info (from LiDAR filename, e.g. "000007_quebec_2022-02-14...")
    location: str                  # e.g. "quebec", "sweden", "germany"
    collection_date: str           # YYYY-MM-DD

    # Assigned at SEQUENCE level (not window level) to prevent leakage; the frozen
    # {seq_id: split} mapping lives at data/processed/splits/sequence_splits.json (Step 4a)
    split: train | val | test

    # Label quality flags (drive the GOLD / SILVER two-tier split — see docs/PIPELINE.md)
    label_confidence_tier: high | medium | low
    # high:   rule-based, clear crossing/not-crossing
    # medium: rule-based, trajectory near the road boundary
    # low:    VLM-assisted or manual, or SILVER (detector-found, unverified)
    is_in_gold_standard: bool      # true = keyframe-anchored & verified (GOLD)

    # Multi-pedestrian: one sample per pedestrian (all labeled)
    num_pedestrians_in_scene: int
    is_key_pedestrian: bool        # whether this is the primary pedestrian


# ─────────────────────────────────────────
# OUTPUT FORMAT
# ─────────────────────────────────────────

output_format:
  # [CONFIRMED] Follow PIE/PSI convention: one JSON file per sample.
  # [CONFIRMED] Addition over PIE/PSI: a dataset-level Parquet index (one row per sample, all
  #   scalar fields) for fast filtering without touching per-sample JSONs. Regenerated if
  #   annotations change.  Example: df[(df.split=="test") & (df.label!="uncertain")]
  per_sample: json                 # data/annotations/{sample_id}.json
  raw_sensor_data: file_references # paths relative to data/raw/sequences/
  dataset_index: parquet           # data/annotations/dataset_index.parquet


# ─────────────────────────────────────────
# DATASET-LEVEL STATISTICS (target)
# ─────────────────────────────────────────

dataset_stats:
  # Working set: 358 sequences with pedestrian annotations + LiDAR on disk.
  # MEASURED (v1 GOLD run 2026-07-15 w/ observed-segment comparison sampling,
  # samples_run_report.json): 1,087 samples / 933 pedestrians (242 TTE-anchored + 845 comparison);
  # crossing ratio 8.1% @1.0s / 15.5% @1.5s / 22.3% @2.0s.
  # [PENDING] supervisor confirmation + SILVER pour (re-run with --tier all).
  estimated_total_samples: 1087   # GOLD v1; grows with SILVER

  # CONFIRMED 70/10/20 (2026-07-16; supersedes the earlier 70/15/15 draft because
  # crosser positives are scarce and benchmark reliability needs them in test). Assigned by
  # Step 4a (scripts/04_assign_splits.py): sequence-level stratified deal, frozen at
  # data/processed/splits/sequence_splits.json. Achieved on GOLD v1: 775/99/213 samples,
  # crossing ratio @2.0s 0.222/0.232/0.221. Re-deal (--force) is allowed only until the
  # first result is reported on this split.
  estimated_split:
    train: "70% (achieved 71%)"
    val:   "10% (achieved 9%)"
    test:  "20% (achieved 20%)"

  # [PENDING] confirm target crossing ratio
  # Real-world urban crossing rate: ~15–30% (ref: JAAD/PIE statistics)
  target_crossing_ratio: "~20–30%"
  # Note: may need to balance via subsampling not_crossing windows
